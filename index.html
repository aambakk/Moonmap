   try{
     const base=dt(), step=20, horizon=18*60;
     let first=null,last=null,prev=false,firstDark=null,representative=null;
     // Cache horizon by 1-degree azimuth bucket; terrain does not change with time.
     const cache=new Map();
     async function state(t){
       const m=moonPosition(t,pt.lat,pt.lng);
       if(m.alt<=0)return {lit:false,m,h:null,clearance:m.alt};
       const key=Math.round(m.az);
       let h=cache.get(key);
       if(!h){h=await profileForAzimuth(m.az,35);cache.set(key,h)}
       return {lit:m.alt>h.angle,m,h,clearance:m.alt-h.angle};
     }
     for(let min=0;min<=horizon;min+=step){
       if(min%60===0)status.textContent='Beregner terrenghorisont · '+Math.round(min/60)+' av 18 timer …';
       const t=new Date(base.getTime()+min*60000),x=await state(t);
       if(x.lit&&!prev&&!first){first={t,x};representative=x}
       if(x.lit)last={t,x};
       if(!x.lit&&prev&&first&&!firstDark){firstDark={t,x};break}
       prev=x.lit;
     }
     // Refine first crossing to ~1 minute.
     if(first){
       let lo=new Date(first.t.getTime()-step*60000),hi=first.t;
       for(let z=0;z<4;z++){
         const mid=new Date((lo.getTime()+hi.getTime())/2),x=await state(mid);
         if(x.lit){hi=mid;representative=x}else lo=mid;
       }
       first.t=hi;first.x=representative;
     }
     status.textContent='✓ Terrengprofil beregnet for valgt punkt';
     if(!first){
       out.innerHTML='<span class="moonlight-bad"><b>🌙 Ingen direkte månebelysning funnet de neste 18 timene.</b></span>';
       return;
     }
     const x=first.x,h=x.h,m=x.m;
     let until=firstDark?hm(firstDark.t):(last?hm(last.t):'minst 18 t');
     out.innerHTML=`<span class="moonlight-good"><b>🌙 Direkte måneskinn ca. ${hm(first.t)} → ${until}</b></span><br>`+
       `Ved innslipp: måne ${m.alt.toFixed(1)}° · terrengkant ${h.angle.toFixed(1)}° · klaring ${x.clearance>=0?'+':''}${x.clearance.toFixed(1)}°<br>`+
       `Høyeste sperrende terreng i retningen: ca. ${h.distance.toFixed(1)} km · ${Math.round(h.elev)} moh.<br>`+
       `<small>Beregnet for valgt punkt og terreng i retning mot månen. Skyer kan fortsatt hindre måneskinn.</small>`;
   }catch(e){
     status.textContent='⚠ Kunne ikke beregne terrengbelysning';
     out.textContent='Feil: '+e.message;
   }finally{
     button.disabled=false;button.textContent='Beregn';
   }
 }
 const b=document.getElementById('terrainCalc');
 if(b)b.onclick=calc;
 window.calculateTerrainClearance=calc;
})();
</script><script id="v38-flyfoto">
(function(){
 let photoLayer=null;
 const mapBtn=document.getElementById('btnMap'),photoBtn=document.getElementById('btnPhoto');
 function ensurePhoto(){
   if(!photoLayer) photoLayer=L.tileLayer(
     'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
     {maxZoom:19,attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}
   );
   return photoLayer;
 }
 function setMode(photo){
   if(photo){
     // Hide current base tile layers but keep overlays/markers.
     map.eachLayer(l=>{if(l instanceof L.TileLayer && l!==photoLayer) map.removeLayer(l)});
     ensurePhoto().addTo(map);
   }else{
     if(photoLayer)map.removeLayer(photoLayer);
     // Restore OSM base.
     L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
       maxZoom:19,attribution:'© OpenStreetMap contributors'
     }).addTo(map).bringToBack();
   }
   mapBtn.classList.toggle('active',!photo);photoBtn.classList.toggle('active',photo);
 }
 mapBtn.onclick=()=>setMode(false);photoBtn.onclick=()=>setMode(true);
})();
</script><script id="panel-layout-and-icons">
