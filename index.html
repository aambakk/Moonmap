<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const R=Math.PI/180,D=180/Math.PI;function n(x){return(x%360+360)%360}function jd(t){return t.getTime()/864e5+2440587.5}function gm(t){let j=jd(t),T=(j-2451545)/36525;return n(280.46061837+360.98564736629*(j-2451545)+.000387933*T*T-T*T*T/38710000)}
function eq(t){let d=jd(t)-2451543.5,N=n(125.1228-.0529538083*d)*R,i=5.1454*R,w=n(318.0634+.1643573223*d)*R,a=60.2666,e=.0549,M=n(115.3654+13.0649929509*d)*R,E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let k=0;k<5;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));let xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv),xh=r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i)),yh=r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i)),zh=r*Math.sin(v+w)*Math.sin(i),lo=Math.atan2(yh,xh),la=Math.atan2(zh,Math.hypot(xh,yh)),Ms=n(356.047+.9856002585*d)*R,ws=n(282.9404+4.70935e-5*d)*R,Ls=Ms+ws,Lm=N+w+M,dd=Lm-Ls,F=Lm-N;lo+=(-1.274*Math.sin(M-2*dd)+.658*Math.sin(2*dd)-.186*Math.sin(Ms)-.059*Math.sin(2*M-2*dd)-.057*Math.sin(M-2*dd+Ms)+.053*Math.sin(M+2*dd)+.046*Math.sin(2*dd-Ms)+.041*Math.sin(M-Ms)-.035*Math.sin(dd)-.031*Math.sin(M+Ms)-.015*Math.sin(2*F-2*dd)+.011*Math.sin(M-4*dd))*R;la+=(-.173*Math.sin(F-2*dd)-.055*Math.sin(M-F-2*dd)-.046*Math.sin(M+F-2*dd)+.033*Math.sin(F+2*dd)+.017*Math.sin(2*M+F))*R;let ob=(23.4393-3.563e-7*d)*R,x=Math.cos(lo)*Math.cos(la),y=Math.sin(lo)*Math.cos(la),z=Math.sin(la),ye=y*Math.cos(ob)-z*Math.sin(ob),ze=y*Math.sin(ob)+z*Math.cos(ob);return{ra:Math.atan2(ye,x),dec:Math.atan2(ze,Math.hypot(x,ye)),lon:lo}}
function sl(t){let d=jd(t)-2451543.5,M=n(356.047+.9856002585*d)*R,w=n(282.9404+4.70935e-5*d)*R,e=.016709-1.151e-9*d,E=M+e*Math.sin(M)*(1+e*Math.cos(M)),x=Math.cos(E)-e,y=Math.sqrt(1-e*e)*Math.sin(E);return n((Math.atan2(y,x)+w)*D)*R}
function moonPosition(t,lat,lon){let m=eq(t),H=(gm(t)+lon)*R-m.ra,p=lat*R,alt=Math.asin(Math.sin(p)*Math.sin(m.dec)+Math.cos(p)*Math.cos(m.dec)*Math.cos(H)),az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(p)-Math.tan(m.dec)*Math.cos(p))+Math.PI,el=Math.acos(Math.cos(m.lon-sl(t)));return{az:n(az*D),alt:alt*D,illum:(1-Math.cos(el))/2}}
function moonRiseSet(t,lat,lon){let s=new Date(t);s.setHours(0,0,0,0);let prev=moonPosition(s,lat,lon).alt,rise=null,set=null;for(let q=5;q<=1440;q+=5){let x=new Date(s.getTime()+q*6e4),a=moonPosition(x,lat,lon).alt;if(prev<=0&&a>0&&!rise)rise=x;if(prev>=0&&a<0&&!set)set=x;prev=a}return{rise,set}}</script><script>const $=x=>document.getElementById(x);let pt={lat:62.2,lng:6.1},marker,ray,track;
const map=L.map('map',{zoomControl:true}).setView([pt.lat,pt.lng],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
map.on('click',e=>setPt({lat:e.latlng.lat,lng:e.latlng.lng}));
function setPt(p){pt=p;if(marker)marker.remove();marker=L.circleMarker([p.lat,p.lng],{radius:7,weight:3,fillOpacity:1}).addTo(map);update()}
function dest(p,b,km){let d=km/6371,B=b*R,a=p.lat*R,l=p.lng*R,a2=Math.asin(Math.sin(a)*Math.cos(d)+Math.cos(a)*Math.sin(d)*Math.cos(B)),l2=l+Math.atan2(Math.sin(B)*Math.sin(d)*Math.cos(a),Math.cos(d)-Math.sin(a)*Math.sin(a2));return{lat:a2*D,lng:l2*D}}
function dt(){return new Date($('date').value+'T'+$('time').value+':00')}function fmt(t){return t?t.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'}):'–'}
function sync(d){let p=x=>String(x).padStart(2,'0');$('date').value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());$('time').value=p(d.getHours())+':'+p(d.getMinutes())}
function update(){let t=dt();if(isNaN(t))return;let m=moonPosition(t,pt.lat,pt.lng),rs=moonRiseSet(t,pt.lat,pt.lng);$('az').textContent=m.az.toFixed(1)+'°';$('alt').textContent=m.alt.toFixed(1)+'°';$('ill').textContent=Math.round(m.illum*100)+'%';$('rs').textContent=fmt(rs.rise)+' / '+fmt(rs.set);$('slider').value=t.getHours()*60+t.getMinutes();$('st').textContent=fmt(t);if(ray)ray.remove();let end=dest(pt,m.az,20);ray=L.polyline([[pt.lat,pt.lng],[end.lat,end.lng]],{weight:4,opacity:.9}).addTo(map);if(track)track.remove();if($('path').checked){let s=new Date(t);s.setHours(0,0,0,0);let a=[];for(let q=0;q<1440;q+=30){let z=new Date(s.getTime()+q*6e4),v=moonPosition(z,pt.lat,pt.lng);if(v.alt>0){let e=dest(pt,v.az,3+Math.min(10,v.alt*.12));a.push([e.lat,e.lng])}}track=L.polyline(a,{weight:2,opacity:.55,dashArray:'5,7'}).addTo(map)}}
sync(new Date());setPt(pt);$('date').onchange=update;$('time').onchange=update;$('path').onchange=update;$('slider').oninput=e=>{let t=dt(),m=+e.target.value;t.setHours(Math.floor(m/60),m%60,0,0);sync(t);update()};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let t=new Date(dt().getTime()+Number(b.dataset.s)*6e4);sync(t);update()});$('now').onclick=()=>{sync(new Date());update()};$('loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>{let p={lat:x.coords.latitude,lng:x.coords.longitude};setPt(p);map.setView([p.lat,p.lng],13)},()=>alert('Ingen tilgang til posisjon. Trykk ønsket punkt i kartet.'));</script><script>
let moonEndMarker=null;
const _moonmapOldUpdate=update;
update=function(){
  _moonmapOldUpdate();
  if(!map)return;
  const t=dt(); if(isNaN(t))return;
  const m=moonPosition(t,pt.lat,pt.lng);
  // Keep the line visually useful at every zoom: its geographic length follows the visible map size.
  const bounds=map.getBounds();
  const ne=bounds.getNorthEast(), sw=bounds.getSouthWest();
  const mapKm=Math.max(1,map.distance(sw,ne)/1000);
  const end=dest(pt,m.az,mapKm*0.20);
  if(ray){ray.setLatLngs([[pt.lat,pt.lng],[end.lat,end.lng]]);ray.setStyle({weight:2});}
  if(moonEndMarker)moonEndMarker.remove();
  const icon=L.divIcon({className:'moon-end-icon',html:'<div class="disc"></div>',iconSize:[28,28],iconAnchor:[14,14]});
  moonEndMarker=L.marker([end.lat,end.lng],{icon,interactive:false,zIndexOffset:900}).addTo(map);
};
map.on('zoomend moveend',()=>update());


function secureContextMessage(){
  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1')
    return 'Siden er åpnet uten HTTPS. Høydedata og GPS kan bli blokkert av nettleseren. Last filen opp på et HTTPS-webhotell.';
  return '';
}

// HTTPS-first elevation providers. Kartverket is attempted first. A second public HTTPS
// elevation endpoint is used as fallback so the app can still calculate when a browser
// rejects one provider due to CORS or endpoint changes.

async function fetchJson(url, timeout=12000){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),timeout);
  try{const r=await fetch(url,{mode:'cors',signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(id)}
}
async function elevationsBatch(points){
  const lat=points.map(p=>p.lat.toFixed(6)).join(',');
  const lon=points.map(p=>p.lng.toFixed(6)).join(',');
  const j=await fetchJson(`https://api.open-meteo.com/v1/elevation?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}`);
  let a=j.elevation;
  if(!Array.isArray(a)) a=[a];
  if(a.length!==points.length || a.some(v=>!Number.isFinite(Number(v)))) throw new Error('Ugyldig høydesvar');
  return a.map(Number);
}
async function terrainHorizonForAzimuth(az,maxKm=20){
  let ds=[];
  for(let k=.15;k<=2;k+=.15)ds.push(k);
  for(let k=2.3;k<=5;k+=.3)ds.push(k);
  for(let k=5.6;k<=maxKm;k+=.6)ds.push(k);
  const pts=[{lat:pt.lat,lng:pt.lng},...ds.map(k=>dest(pt,az,k))];
  const hs=await elevationsBatch(pts),obs=hs[0];
  let best={angle:-90,distance:0,elev:obs};
  ds.forEach((km,i)=>{
    const h=hs[i+1],curvature=(km*1000)*(km*1000)/(2*6371000);
    const angle=Math.atan2(h-obs-curvature,km*1000)*D;
    if(angle>best.angle)best={angle,distance:km,elev:h};
  });
  return {obs,...best};
}
async function calculateTerrainClearance(){
  const status=document.getElementById('terrainStatus'),out=document.getElementById('terrainResult');
  const sec=secureContextMessage(); if(sec){status.textContent='⚠ '+sec;return;}
  status.textContent='Henter terrengprofil …';out.textContent='';
  try{
    const base=dt(); let found=null;
    // Calculate the horizon for the moon direction at each 20-minute step.
    // Each profile is one batched HTTPS request instead of dozens of requests.
    for(let min=0;min<=1080;min+=20){
      const t=new Date(base.getTime()+min*60000),m=moonPosition(t,pt.lat,pt.lng);
      if(m.alt<=-1)continue;
      const h=await terrainHorizonForAzimuth(m.az,20);
      if(m.alt>h.angle){found={t,m,h};break}
    }
    status.textContent='✓ Høydedata mottatt';
    if(found){
      const {t,m,h}=found;
      out.innerHTML=`Månen går klar av terrenget ca. <b>${fmt(t)}</b> · azimut ${m.az.toFixed(1)}° · høydevinkel ${m.alt.toFixed(1)}°<br>Terrenghorisont ${h.angle.toFixed(1)}° · blokkering ca. ${h.distance.toFixed(1)} km unna (${Math.round(h.elev)} moh.)`;
    }else out.textContent='Fant ikke terrengklaring innen 18 timer.';
  }catch(e){status.textContent='⚠ Kunne ikke hente høydedata';out.textContent='Feil: '+e.message}
}
document.getElementById('terrainCalc').onclick=calculateTerrainClearance;
const msg=secureContextMessage(); if(msg)document.getElementById('terrainStatus').textContent='⚠ '+msg;
</script><script>
document.querySelectorAll('.panel-toggle').forEach(b=>{

    b.textContent=c?'+':'−';

    setTimeout(()=>map.invalidateSize(),20);
  });
});
</script><script>
function compass(d){return ['N','NØ','Ø','SØ','S','SV','V','NV'][Math.round(((d%360)+360)%360/45)%8]}
function weatherText(c){if(c===0)return'Klart';if(c<=3)return'Delvis skyet';if(c===45||c===48)return'Tåke';if(c>=51&&c<=67)return'Regn';if(c>=71&&c<=77)return'Snø';if(c>=80&&c<=82)return'Byger';if(c>=95)return'Torden';return'Vær'}
async function loadWeather(){
 const st=document.getElementById('weatherStatus'),box=document.getElementById('weatherData');
 st.textContent='Henter værdata …';box.innerHTML='';
 try{
   const url=`https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lng}&hourly=temperature_2m,precipitation_probability,precipitation,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code&wind_speed_unit=ms&timezone=auto&forecast_days=7`;
   const j=await fetchJson(url);
   const target=dt().getTime();
   let i=0,best=Infinity;
   j.hourly.time.forEach((x,n)=>{let q=Math.abs(new Date(x).getTime()-target);if(q<best){best=q;i=n}});
   const h=j.hourly;
   if(best>4*3600000){st.textContent='Valgt tidspunkt er utenfor værvarselet';return}
   st.textContent=`${weatherText(h.weather_code[i])} · prognose nær valgt tidspunkt`;
   const vis=h.visibility[i]/1000;
   box.innerHTML=[
    ['☁️',h.cloud_cover[i]+'%','Skydekke'],
    ['🌧',h.precipitation_probability[i]+'%','Nedbørssjanse'],
    ['💧',h.precipitation[i].toFixed(1)+' mm','Nedbør'],
    ['🌡',h.temperature_2m[i].toFixed(1)+'°','Temperatur'],
    ['💨',h.wind_speed_10m[i].toFixed(1)+' m/s','Vind '+compass(h.wind_direction_10m[i])],
    ['↯',h.wind_gusts_10m[i].toFixed(1)+' m/s','Vindkast'],
    ['👁',vis.toFixed(1)+' km','Sikt'],
    ['☁',h.cloud_cover_low[i]+'%','Lave skyer'],
    ['☾',h.cloud_cover_high[i]+'%','Høye skyer']
   ].map(x=>`<div class="wx">${x[0]} <b>${x[1]}</b><small>${x[2]}</small></div>`).join('');
 }catch(e){st.textContent='⚠ Kunne ikke hente værdata';box.innerHTML=''}
}
document.getElementById('weatherRefresh').onclick=loadWeather;
setTimeout(loadWeather,300);

</script><script id="v33-behavior">
(function(){
 function collapse(id){
   const el=document.getElementById(id); if(!el || el.classList.contains('is-collapsed')) return;
   el.classList.add('is-collapsed');
   const b=el.querySelector('.panel-toggle'); if(b){b.textContent='+';b.setAttribute('aria-label','Utvid')}
 }
 document.getElementById('terrainCalc')?.addEventListener('click',()=>collapse('weatherBox'));
 document.getElementById('weatherRefresh')?.addEventListener('click',()=>collapse('terrainBox'));
 // Reflow Leaflet after every panel toggle.
 document.addEventListener('click',e=>{
   if(e.target.classList.contains('panel-toggle')) setTimeout(()=>map.invalidateSize(),30);
 });
})();
</script><script id="v34-weather-toggle-fix">
(function(){
 const wb=document.querySelector('#weatherBox .panel-toggle');
 if(!wb)return;
 // Replace the button with a clone to remove all previously registered click listeners.
 const nb=wb.cloneNode(true);
 wb.replaceWith(nb);
 nb.addEventListener('click',function(e){
   e.preventDefault(); e.stopPropagation();
   const el=document.getElementById('weatherBox');
   const c=el.classList.toggle('is-collapsed');
   this.textContent=c?'+':'−';
   this.setAttribute('aria-label',c?'Utvid vær':'Minimer vær');
   setTimeout(()=>{try{map.invalidateSize()}catch(_){}},30);
 });
})();
</script></body></html>
